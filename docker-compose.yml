services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      - DB_NAME=hrms
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - JWT_EXPIRY=24h
      - CORS_ORIGINS=${CORS_ORIGINS:-https://hrms.swethastructures.com}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-claude-haiku-4-5-20251001}
      - STATIC_DIR=/app/public
    volumes:
      - hrms_uploads:/app/server/uploads
    depends_on:
      mysql:
        condition: service_healthy
      proxy-fix:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: hrms
    volumes:
      - hrms_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  proxy-fix:
    image: docker:cli
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "Connecting coolify-proxy to per-app network..."
        docker network connect ko4wg0kk8c4s04g8o8cc08k0 coolify-proxy 2>/dev/null || echo "Already connected or network not found"
        echo "Proxy fix complete"

volumes:
  hrms_data:
  hrms_uploads:
